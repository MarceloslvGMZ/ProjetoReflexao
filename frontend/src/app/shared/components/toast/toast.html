<div
  class="pointer-events-none fixed right-4 bottom-4 z-[70] flex w-[min(100%-2rem,24rem)] flex-col gap-2"
  aria-live="polite"
>
  @for (toast of toasts.itens(); track toast.id) {
    <div role="status" [class]="classe(toast.tipo)">
      @if (toast.tipo === 'erro') {
        <svg lucideCircleAlert [size]="18" class="mt-0.5 shrink-0"></svg>
      } @else {
        <svg lucideCircleCheck [size]="18" class="mt-0.5 shrink-0"></svg>
      }
      <p class="flex-1 text-slate-800">{{ toast.texto }}</p>
      <button
        type="button"
        class="rounded text-slate-400 hover:text-slate-700"
        aria-label="Fechar notificação"
        (click)="toasts.remover(toast.id)"
      >
        <svg lucideX [size]="16"></svg>
      </button>
    </div>
  }
</div>
