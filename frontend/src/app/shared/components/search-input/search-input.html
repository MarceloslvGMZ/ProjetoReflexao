<label class="block">
  <span [class]="exibirRotulo() ? 'mb-1 block text-xs font-medium text-slate-500' : 'sr-only'">{{ rotulo() }}</span>
  <app-adorno-campo>
    <input
      type="search"
      [class]="caixa"
      [value]="valor()"
      [placeholder]="placeholder()"
      [attr.aria-label]="rotulo()"
      (input)="aoDigitar($event)"
    />
    <svg adorno lucideSearch [size]="16" class="text-slate-400"></svg>
  </app-adorno-campo>
</label>
