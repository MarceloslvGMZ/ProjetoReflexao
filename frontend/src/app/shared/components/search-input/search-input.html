<label class="relative block">
  <span class="sr-only">{{ rotulo() }}</span>
  <svg
    lucideSearch
    [size]="16"
    class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-slate-400"
  ></svg>
  <input
    type="search"
    class="w-full rounded-lg border border-slate-300 bg-white py-2 pr-3 pl-9 text-sm shadow-xs focus:border-primaria-500 focus:ring-2 focus:ring-primaria-200 focus:outline-none"
    [value]="valor()"
    [placeholder]="placeholder()"
    [attr.aria-label]="rotulo()"
    (input)="aoDigitar($event)"
  />
</label>
